# -- Pipeline of the GitLab mirror: lints the component and runs it from this commit.
# Schedule this project's pipeline (or "Run pipeline") to clean up the branches of the
# $GITLAB_TOKEN user; it stays a dry run unless CLEANER_DRY_RUN=false is passed.
include:
  - component: $CI_SERVER_FQDN/m13tLabs/gitlab-helpers/pipeline-ci-components@v0.3.1
  # include the component located in the current project from the current SHA
  - component: $CI_SERVER_FQDN/$CI_PROJECT_PATH/cleanup-branches@$CI_COMMIT_SHA
    inputs:
      inactivity: 90d
      dry-run: true

lint:
  stage: test
  image: alpine:3.24
  rules:
    - if: $CI_PIPELINE_SOURCE == "push" || $CI_PIPELINE_SOURCE == "merge_request_event"
  script:
    - apk add --no-cache bash bats jq shellcheck yamllint >/dev/null
    - shellcheck gitlab-cleaner
    - yamllint -c .yamllint.yml templates/ .gitlab-ci.yml
    - bats tests/
