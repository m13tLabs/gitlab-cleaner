name: Release

on:
  workflow_dispatch:
    inputs:
      release_type:
        description: 'Type of release to build: patch, minor, major, or custom'
        type: choice
        options: [patch, minor, major, custom]
        default: patch
        required: true
      custom_version:
        description: "Version to release (only used when release_type is 'custom', e.g. 1.2.3)"
        type: string
        required: false
        default: ''
      draft_release:
        description: 'Create the GitHub release as a draft'
        type: boolean
        required: false
        default: true
  schedule:
    # Monthly patch release (1st of the month, 03:00 UTC) so the published
    # image picks up glab, base-image and dependency updates even without code changes.
    - cron: '0 3 1 * *'

jobs:
  release:
    uses: m13tLabs/gh-actions-templates/.github/workflows/docker-release.yml@main
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    with:
      images: '["ghcr.io/m13tlabs/gitlab-cleaner","docker.io/m13t/gitlab-cleaner"]'
      client_id: ${{ vars.CI_CLIENT_ID }}
      release_type: ${{ inputs.release_type || 'patch' }}
      custom_version: ${{ inputs.custom_version }}
      default_branch: ${{ github.ref_name }}
      # Pin the component's default image tag to the version being released.
      bump_command: |
        f=templates/cleanup-branches.yml
        sed -i -E "s/^( +default: )\"[^\"]*\"( +# x-release-version)$/\1\"${RELEASE_VERSION}\"\2/" "$f"
        grep -q "default: \"${RELEASE_VERSION}\"  # x-release-version" "$f"
      # Scheduled runs have no inputs: publish directly instead of leaving a draft.
      draft_release: ${{ github.event_name != 'schedule' && inputs.draft_release }}
      dockerhub: true
    secrets: inherit
