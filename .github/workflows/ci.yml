name: CI

on:
  push:
    branches: [develop]
  pull_request:
  merge_group:
  # allow manual action run
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: shellcheck + bats
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install bats
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends bats

      - name: shellcheck
        run: shellcheck gitlab-cleaner

      - name: bats
        run: bats tests/

  ci:
    uses: m13tLabs/gh-actions-templates/.github/workflows/docker-ci.yml@main
    permissions:
      contents: read
      pull-requests: write
      checks: write
      packages: read
      attestations: write
    with:
      image_name: gitlab-cleaner
      dockerhub: true
      smoke_test: |
        out="$(docker run --rm "$IMAGE" --version)"
        echo "$out"
        echo "$out" | grep -q '^glab ' || { echo "glab missing from image" >&2; exit 1; }
        # The test suite stubs glab, so it can run against the image's own script and tools.
        docker run --rm -u 0 -v "$PWD/tests:/tests:ro" --entrypoint sh "$IMAGE" \
          -c 'apk add --no-cache bats >/dev/null && CLEANER=/usr/bin/gitlab-cleaner bats /tests'
    secrets: inherit
